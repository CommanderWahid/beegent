[project]
name = "beegent"
version = "0.1.0"
description = "Multi-agent pipeline that turns (country, use_case) into verified geospatial download URLs"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
