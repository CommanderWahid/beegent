<clipPath id="ringClip"><circle cx="210" cy="210" r="158"/></clipPath>
</defs>

<circle cx="210" cy="210" r="175" fill="none" stroke="#2A211B" stroke-width="2"/>
<circle cx="210" cy="210" r="160" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 4"/>

