<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img">
<title>Scoutbee badge icon</title>
<desc>A bee mascot inside a coin-like badge ring, with a faint map grid behind it and a magnifying glass containing a tiny location pin, signaling geospatial data search. Square canvas for use as a repo avatar.</desc>
