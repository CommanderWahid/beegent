name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync

      # No secrets, and none needed: the suite is offline by intent - no network,
      # no API key, no LLM. A test that reaches the network is a bug.
      - run: uv run pytest

      - run: uvx ruff check .
