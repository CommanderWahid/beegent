name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --extra api: tests/test_api.py exercises the web API, whose deps are an extra.
      # Without it those tests skip themselves and the API ships untested.
      - run: uv sync --extra api

      # No secrets, and none needed: the suite is offline by intent - no network,
      # no API key, no LLM. A test that reaches the network is a bug.
      - run: uv run pytest

      - run: uvx ruff check .

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
        working-directory: ui

      # The Angular app is a pure consumer, so a build is the whole check: it must compile
      # against the API's types without the backend running.
      - run: npx ng build --configuration production
        working-directory: ui
